[workspace]
resolver = "3"
members = ["game_core", "wii/game", "tools/preview", "tools/import"]
# `fg_game` is a Wii-only staticlib (no_std + panic handler); host builds and tests skip it.
default-members = ["game_core", "tools/preview", "tools/import"]

[workspace.package]
edition = "2024"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 1

# Quicker builds for testing in Dolphin (`build.bat fast`, `make RUST_PROFILE=dolphin`): no LTO, parallel
# codegen. Slower code than release; ship release builds.
[profile.dolphin]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
