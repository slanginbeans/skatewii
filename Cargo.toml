[workspace]
resolver = "3"
members = ["game_core", "wii/game", "tools/preview"]
# `fg_game` is a Wii-only staticlib (no_std + panic handler); host builds and tests skip it.
default-members = ["game_core", "tools/preview"]

[workspace.package]
edition = "2024"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
debug = 1
