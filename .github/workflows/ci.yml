name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host checks (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: No game data in the repo (CLAUDE.md rule 1)
        run: bash tools/check_no_game_data.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Preview frames
        run: cargo run --release -p fg_preview -- out/preview
      - uses: actions/upload-artifact@v4
        with:
          name: preview-frames
          path: out/preview/*.png

  ppc:
    name: PowerPC 750CL (Wii CPU) build and tests under qemu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross tools
        run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-powerpc-linux-gnu libc6-dev-powerpc-cross
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Wii staticlib
        run: cargo build --release -p fg_game --target powerpc-unknown-linux-gnu
      - name: Clippy for the Wii target
        run: cargo clippy --release -p fg_game -p game_core --target powerpc-unknown-linux-gnu -- -D warnings
      - name: Game core tests on an emulated 750CL
        run: cargo test -p game_core --target powerpc-unknown-linux-gnu
      - name: Only expected external symbols
        run: tools/check_symbols.sh target/powerpc-unknown-linux-gnu/release/libfg_game.a

  docker-route:
    name: build.sh (Docker route, as a user runs it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: test -s dist/apps/flatground/boot.dol && test -s dist/apps/flatground/meta.xml
      - name: No disc image on CI, so nothing converted (CLAUDE.md rule 1)
        run: test ! -e dist/apps/flatground/data

  windows-bat:
    name: build.bat switches and no-tools message
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switches
        shell: cmd
        run: |
          call build.bat showargs > args1.txt
          findstr /c:"TARGET=package UPDATE=1 PAUSE=0" args1.txt || exit /b 1
          call build.bat noupdate nopause showargs > args2.txt
          findstr /c:"TARGET=package UPDATE=0 PAUSE=0" args2.txt || exit /b 1
          call build.bat clean showargs > args3.txt
          findstr /c:"TARGET=clean UPDATE=0" args3.txt || exit /b 1
          call build.bat dolphin showargs > args4.txt
          findstr /c:"TARGET=package UPDATE=1 PAUSE=0 DOLPHIN=1" args4.txt || exit /b 1
          type args1.txt args2.txt args3.txt args4.txt
      - name: Without devkitPro or Docker it fails with instructions
        shell: cmd
        env:
          FG_NO_DOCKER: "1"
        run: |
          call build.bat noupdate nopause > notools.txt
          if not errorlevel 1 exit /b 1
          type notools.txt
          findstr /c:"No Wii build tools found" notools.txt || exit /b 1

  wii:
    name: Wii .dol (devkitPPC)
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Host compiler and Rust
        run: |
          apt-get update && apt-get install -y --no-install-recommends build-essential curl ca-certificates
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rustup show active-toolchain || rustup toolchain install
          make -C wii package
          test ! -e dist/apps/flatground/data
      - uses: actions/upload-artifact@v4
        with:
          name: flatground-sd-card
          path: dist/apps
      - uses: actions/upload-artifact@v4
        with:
          name: flatground-debug-elf
          path: dist/debug
